name: Build APK

# Builds the app on every push to main.
#
# Signing uses YOUR key, read from repository secrets (see README, "Run your own copy").
# Nothing secret is stored in this repository. Without the secrets the build still runs,
# signed with a throwaway debug key, and the APK is kept as a workflow artifact only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # publish the "latest" release (only when your key is configured)
    env:
      HAS_KEY: ${{ secrets.PLAYITLOUD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.11.1"

      - name: Restore your signing key from secrets
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYITLOUD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/playitloud.jks"
          echo "PLAYITLOUD_KEYSTORE_PATH=$RUNNER_TEMP/playitloud.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          PLAYITLOUD_KEYSTORE_PASSWORD: ${{ secrets.PLAYITLOUD_KEYSTORE_PASSWORD }}
          PLAYITLOUD_KEY_ALIAS: ${{ secrets.PLAYITLOUD_KEY_ALIAS }}
          PLAYITLOUD_KEY_PASSWORD: ${{ secrets.PLAYITLOUD_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/playitloud.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playitloud-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Publish to the "latest" release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk playitloud.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest playitloud.apk \
            --title "PlayitLoud build #${RUN_NUMBER}" \
            --notes "Built from ${SHA}. Download playitloud.apk to install." \
            --prerelease
